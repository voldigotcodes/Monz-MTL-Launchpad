[package]
name = "monz-mtl-launchpad"
version = "0.1.0"
description = "Desktop launcher for Meta campaigns"
authors = ["Monz"]
edition = "2021"
rust-version = "1.70"

[dependencies]
tauri = { version = "1", features = ["dialog-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
tauri-build = { version = "1", features = [] }
